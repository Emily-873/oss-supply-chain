name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# Prevents multiple concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Zensical
        run: |
          python -m pip install --upgrade pip
          pip install zensical==0.0.52

      - name: Copy content to docs directory
        run: |
          mkdir -p site/docs/stylesheets
          cp -r contents/book1 site/docs/
          cp -r contents/book2 site/docs/
          cp -r contents/book3 site/docs/
          cp -r contents/frontmatter site/docs/
          cp -r contents/appendices site/docs/
          cp contents/frontmatter/home.md site/docs/index.md
          cp scripts/robots.txt site/docs/
          cp scripts/zensical.toml site/
          cp scripts/extra.css site/docs/stylesheets/

      - name: Replace fonts in SVG files
        run: |
          find site/docs/ -name "*.svg" | while read -r svgfile; do
            sed -i 's/font-family="[^"]*"/font-family="Roboto, Arial, sans-serif"/g' "$svgfile"
          done

      - name: Build documentation
        working-directory: site
        run: zensical build --clean -f zensical.toml

      - name: Copy PDFs to site
        run: |
          mkdir -p site/_site
          if ls dist/*.pdf 1> /dev/null 2>&1; then
            cp dist/*.pdf site/_site/
            echo "Copied PDFs to site/_site/"
          else
            echo "Warning: No PDF files found in dist/"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # To deploy to Pages
      id-token: write   # To verify the deployment originates from a secure source (OIDC)    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
